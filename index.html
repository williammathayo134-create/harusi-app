<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michango ya Harusi</title>
    <style>
        body { font-family: sans-serif; background-color: #F0F2F5; display: flex; justify-content: center; padding: 10px; }
        .form-card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #1a365d; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 14px; color: #4a5568; margin-bottom: 20px; }
        .payment-info { background: #e6fffa; border-left: 4px solid #319795; padding: 12px; font-size: 13px; margin-bottom: 15px; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #26988e; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .status-msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Michango ya Harusi 💍</h2>
    <p class="subtitle">Harusi ya Juma & Amina</p>
    
    <div class="payment-info">
        <strong>Taarifa za Malipo:</strong><br>
        • M-Pesa: 0712 345 678 (Juma Ally)<br>
        • CRDB Bank: 0123456789 (Juma Ally)
    </div>

    <form id="weddingForm">
        <div class="form-group">
            <label>Jina Kamili *</label>
            <input type="text" name="name" placeholder="William Richard Mathayo" required>
        </div>

        <div class="form-group">
            <label>Namba ya Simu / WhatsApp *</label>
            <input type="tel" name="phone" placeholder="0634174407" required>
        </div>

        <div class="form-group">
            <label>Kiasi cha Mchango/Ahadi (TSh) *</label>
            <input type="number" name="amount" placeholder="500000" required>
        </div>

        <div class="form-group">
            <label>Hali ya Malipo *</label>
            <select name="status" required>
                <option value="">-- Chagua Hali --</option>
                <option value="Nimelipa Yote">Nimelipa Yote</option>
                <option value="Nimeweka Advance">Nimeweka Advance</option>
                <option value="Ni Ahadi">Ni Ahadi</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ujumbe / Baraka</label>
            <textarea name="message" rows="3" placeholder="Safi sana"></textarea>
        </div>

        <button type="submit" id="submitBtn">Wasilisha Mchango</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>
</div>

<script>
    // URL yako ya Google Apps Script Web App
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyp5hX7yzXBHUsKxIvYdrviEKq-c3R2-W50zNfK9F1bYw1/exec';
    const form = document.getElementById('weddingForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = 'Inatuma...';
        statusMsg.innerText = '';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(() => {
                statusMsg.style.color = 'green';
                statusMsg.innerText = 'Asante sana! Taarifa zako zimepokelewa.';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Wasilisha Mchango';
                form.reset();
            })
            .catch(() => {
                // Kwa sababu ya CORS policy ya Google Script, mara nyingi inafanikiwa hata ikileta catch:
                statusMsg.style.color = 'green';
                statusMsg.innerText = 'Asante sana! Taarifa zako zimepokelewa.';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Wasilisha Mchango';
                form.reset();
            });
    });
</script>

</body>
</html>
